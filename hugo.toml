baseURL = 'http://localhost:1313/'
languageCode = 'zh-cn'
title = 'SoulLand'
theme = 'PaperMod'

[pagination]
  pageSize = 5

[params]
  env = "production"
  description = "SoulLand - 灵魂的栖息地"
  author = "Jackray"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  UseHugoToc = true
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "👋 Hey, 欢迎来到 SoulLand"
    Content = """灵魂的栖息地
- 🧠 记录思考与感悟
- 💻 分享技术与实践
- 🌍 探索世界与生活
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jackraywang2020"
  [[params.socialIcons]]
    name = "gitee"
    url = "https://gitee.com/jackray_wang"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:jackray_wang@sina.com"

  [params.editPost]
    URL = ""
    Text = ""
    appendFilePath = false

  [params.assets]
    favicon = "/favicon.ico"
    disableHLJS = false
    disableFingerprinting = true

  [params.label]
    text = "SoulLand"
    icon = "/apple-touch-icon.png"
    iconHeight = 35

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true
    linkFullImages = true

  [params.fuse]
    isCaseSensitive = false
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    style = "dracula"
    tabWidth = 2

[[menu.main]]
  identifier = "posts"
  name = "📝 文章"
  url = "/posts/"
  weight = 5

[[menu.main]]
  identifier = "tags"
  name = "🏷️ 标签"
  url = "/tags/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "📁 归档"
  url = "/archives/"
  weight = 15

[[menu.main]]
  identifier = "search"
  name = "🔍 搜索"
  url = "/search/"
  weight = 20
